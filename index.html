<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AXIOM ENGINE</title><style>:root{--bg:#0c0d11;--p:#14161c;--line:#30343e;--ink:#e5e7eb;--mut:#777e8c;--vio:#a679ff;--cyan:#58d7e8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:12px ui-monospace,monospace;height:100vh;overflow:hidden}.app{height:100vh;display:grid;grid-template-rows:54px 1fr 28px}.top{display:flex;align-items:center;gap:18px;padding:0 15px;background:#101117;border-bottom:1px solid var(--line)}.logo{font:900 23px sans-serif;letter-spacing:-.05em}.logo span{color:var(--vio)}.menu{color:var(--mut)}.spacer{flex:1}.top button,.tool button{border:1px solid var(--line);background:#191c23;color:var(--ink);padding:7px 10px;border-radius:6px;font:inherit;cursor:pointer}.top .play{background:var(--vio);color:#100d18}.main{display:grid;grid-template-columns:220px 1fr 270px;min-height:0}.side{background:var(--p);border-right:1px solid var(--line);padding:12px;overflow:auto}.right{border-left:1px solid var(--line);border-right:0}.side h2{font-size:10px;color:var(--mut);letter-spacing:.14em}.entity{padding:8px;border-radius:6px;margin:3px 0;cursor:pointer}.entity.on{background:#292334;color:#cbb5ff}.entity:before{content:'◇';margin-right:7px;color:var(--cyan)}.add{width:100%;border:1px dashed var(--line);background:transparent;color:var(--mut);padding:7px;margin-top:8px}.center{display:grid;grid-template-rows:40px 1fr;background:#090b0e;min-width:0}.tool{display:flex;align-items:center;padding:5px 10px;gap:6px;border-bottom:1px solid var(--line);background:#12141a}.tool button.on{color:var(--vio);border-color:var(--vio)}.view{position:relative;overflow:hidden;background-image:linear-gradient(#20242c 1px,transparent 1px),linear-gradient(90deg,#20242c 1px,transparent 1px);background-size:32px 32px}.view canvas{width:100%;height:100%}.badge{position:absolute;left:10px;bottom:10px;color:var(--mut)}.component{border:1px solid var(--line);border-radius:7px;margin-bottom:8px;overflow:hidden}.chead{padding:8px;background:#1b1e25;font-weight:bold}.fields{padding:8px}.field{display:grid;grid-template-columns:70px 1fr 1fr;gap:5px;margin:6px 0;align-items:center}.field input{min-width:0;background:#0e1015;color:var(--ink);border:1px solid var(--line);padding:5px;border-radius:4px;font:inherit}.status{display:flex;align-items:center;padding:0 10px;color:var(--mut);background:#111319;border-top:1px solid var(--line)}.status span{margin-right:18px}.modal{position:fixed;inset:0;background:#000b;display:none;place-items:center}.modal.on{display:grid}.dialog{background:#181b22;border:1px solid #3b404b;padding:18px;border-radius:10px;width:400px}.dialog pre{background:#0b0d11;padding:12px;color:var(--cyan);overflow:auto}@media(max-width:760px){.main{grid-template-columns:160px 1fr}.right{display:none}.menu{display:none}}</style></head><body><div class="app"><header class="top"><div class="logo">AXIOM<span>/2D</span></div><span class="menu">File Edit Scene Entity</span><div class="spacer"></div><button id="undo">↶ UNDO</button><button id="redo">↷ REDO</button><button id="export">EXPORT .AXIOM</button><button class="play" id="play">▶ PLAY</button></header><main class="main"><aside class="side"><h2>SCENE / neon-relay</h2><div id="entities"></div><button class="add" id="add">+ ENTITY</button><h2>ASSETS</h2><div class="entity">player.sprite</div><div class="entity">crate.sprite</div><div class="entity">world.tilemap</div></aside><section class="center"><div class="tool"><button class="on">MOVE</button><button>ROTATE</button><button>SCALE</button><span style="margin-left:auto;color:#777e8c">GRID 32 · LOCAL</span></div><div class="view"><canvas id="c"></canvas><div class="badge">CAMERA / 1280×720 · ECS RUNTIME</div></div></section><aside class="side right"><h2>INSPECTOR</h2><b id="ename">Player</b><div class="component"><div class="chead">TRANSFORM</div><div class="fields"><div class="field"><span>Position</span><input id="x" value="220"><input id="y" value="310"></div><div class="field"><span>Scale</span><input value="1.0"><input value="1.0"></div></div></div><div class="component"><div class="chead">SPRITE</div><div class="fields"><div class="field"><span>Tint</span><input value="#a679ff"><input value="100%"></div></div></div><div class="component"><div class="chead">RIGID BODY</div><div class="fields"><div class="field"><span>Mass</span><input value="1.0"><input value="dynamic"></div><div class="field"><span>Gravity</span><input value="0"><input value="980"></div></div></div></aside></main><footer class="status"><span>● READY</span><span>6 ENTITIES</span><span>60 FPS</span><span style="margin-left:auto">AXIOM ENGINE 0.3</span></footer></div><div class="modal" id="modal"><div class="dialog"><h2>Portable scene exported</h2><pre id="json"></pre><button onclick="modal.classList.remove('on')">CLOSE</button></div></div><script>
let es=[{n:'World',t:'world'},{n:'Player',t:'player',x:220,y:310},{n:'Camera',t:'camera'},{n:'Crate A',t:'crate',x:500,y:360},{n:'Crate B',t:'crate',x:620,y:280},{n:'Exit Portal',t:'portal',x:800,y:250}],sel=1,playing=false,hist=[];const $=s=>document.querySelector(s),c=$('#c'),g=c.getContext('2d');function renderList(){$('#entities').innerHTML=es.map((e,i)=>`<div class="entity ${i===sel?'on':''}" data-i="${i}">${e.n}</div>`)}$('#entities').onclick=e=>{let n=e.target.closest('[data-i]');if(!n)return;sel=+n.dataset.i;$('#ename').textContent=es[sel].n;if(es[sel].x){$('#x').value=es[sel].x;$('#y').value=es[sel].y}renderList()};$('#add').onclick=()=>{hist.push(JSON.stringify(es));es.push({n:'Entity '+es.length,t:'crate',x:400,y:200});renderList()};$('#undo').onclick=()=>{if(hist.length)es=JSON.parse(hist.pop());renderList()};$('#redo').onclick=()=>{};$('#play').onclick=()=>{playing=!playing;$('#play').textContent=playing?'■ STOP':'▶ PLAY'};$('#export').onclick=()=>{$('#json').textContent=JSON.stringify({format:'axiom.scene/1',name:'neon-relay',entities:es},null,2);$('#modal').classList.add('on')};function resize(){c.width=c.clientWidth*devicePixelRatio;c.height=c.clientHeight*devicePixelRatio;g.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}onresize=resize;resize();function draw(t){let w=c.clientWidth,h=c.clientHeight;g.clearRect(0,0,w,h);g.fillStyle='#12151b';g.fillRect(0,h*.68,w,h*.32);g.strokeStyle='#58d7e8';g.lineWidth=3;g.beginPath();g.moveTo(0,h*.68);g.lineTo(w,h*.68);g.stroke();es.forEach((e,i)=>{if(!e.x)return;let xx=e.x%w,yy=Math.min(h*.68-25,e.y%h);if(playing&&e.t==='player')xx+=Math.sin(t*.002)*70;g.save();g.translate(xx,yy);g.fillStyle=e.t==='player'?'#a679ff':e.t==='portal'?'#58d7e8':'#d28b43';if(e.t==='portal'){g.strokeStyle='#58d7e8';g.lineWidth=7;g.beginPath();g.ellipse(0,0,24,55,0,0,7);g.stroke()}else g.fillRect(-20,-20,40,40);if(i===sel){g.strokeStyle='#fff';g.lineWidth=1;g.strokeRect(-25,-25,50,50);g.strokeStyle='#f35f75';g.beginPath();g.moveTo(0,0);g.lineTo(45,0);g.stroke()}g.restore()});requestAnimationFrame(draw)}requestAnimationFrame(draw);renderList();</script></body></html>
